name: Build Vion IPA
on:
  workflow_dispatch:

jobs:
  build_ios:
    name: Compile iOS App Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Force Unsigned Build Configuration
        run: |
          find . -name "*.xcodeproj" -exec sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' {}/project.pbxproj \; || true
          find . -name "*.xcodeproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' {}/project.pbxproj \; || true

      - name: Compile App Bundle
        run: |
          # Find the actual project file dynamically wherever it is hidden
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found project at: $PROJECT_PATH"
          
          # Extract just the scheme name or default to Vion
          xcodebuild -project "$PROJECT_PATH" -scheme Vion -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build || \
          xcodebuild -project "$PROJECT_PATH" -scheme vion -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          # Locate the compiled .app file dynamically in the build directory
          APP_PATH=$(find build -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Vion.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vion-Free-IPA
          path: Vion.ipa
