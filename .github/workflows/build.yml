name: Build Vion IPA
on:
  workflow_dispatch:

jobs:
  build_ios:
    name: Compile iOS App Bundle
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Important if Vion pulls Vita3K core assets

      - name: Install System Dependencies
        run: |
          brew install cmake ninja

      - name: Configure CMake for iOS
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCODE_SIGNING_ALLOWED=OFF \
            -DCODE_SIGNING_REQUIRED=OFF

      - name: Compile Application Core
        run: |
          cmake --build build --config Release

      - name: Package App Bundle into IPA
        run: |
          mkdir -p Payload
          # Locates the newly created .app package out of the build directory
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find compiled .app folder bundle!" && exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Vion.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vion-Free-IPA
          path: Vion.ipa
